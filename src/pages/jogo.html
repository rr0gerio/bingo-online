<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f0df">
    <meta property="og:url" content="https://rr0gerio.github.io/bingo-online/src/pages/jogo.html">
    <meta property="og:image" content="https://rr0gerio.github.io/bingo-online/src/images/compartilhar.png">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" content="Bingo">
    <meta property="og:site_name" content="Bingo">
    <meta property="og:description" content="Bingo para jogar entre amigos.">
    <meta property="og:type" content="website">
    <link rel="icon" href="../images/icone.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/master.css">
    <title>Bingo | Partida</title>
    <style>
        .jogo { max-width: 1200px; margin: 24px auto; padding: clamp(20px, 4vw, 40px); border: 2px solid var(--coral); border-radius: var(--raio-cartao); background: var(--papel); box-shadow: var(--sombra); }
        .controles { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin: 24px 0; }
        .controles fieldset { display: flex; flex-wrap: wrap; gap: 16px; }
        .controles legend { font-weight: 700; }
        .controles label { padding: 6px 0; cursor: pointer; }
        .controles input { accent-color: var(--destaque); }
        #mensagem { padding: 12px 16px; border-radius: var(--raio); background: var(--tom); }
        #mensagem.vitoria { background: #d9f3e1; font-weight: 700; }
        #mensagem.erro { background: #fde3e0; }
        .sorteio { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin: 24px 0; }
        #ultimo { min-width: 2em; font-family: 'Titan One', sans-serif; font-size: 3rem; text-align: center; color: var(--destaque); font-variant-numeric: tabular-nums; }
        #chamados { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 260px; }
        #chamados li { min-width: 2.4em; padding: 2px 8px; border-radius: 6px; background: var(--superficie); text-align: center; font-size: 0.875rem; font-weight: 500; font-variant-numeric: tabular-nums; }
        #cartelas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 24px; }
        #cartelas article { max-width: 460px; padding: 16px; border: 1px solid var(--linha); border-radius: var(--raio-cartao); background: var(--superficie); }
        #cartelas h2 { font-size: 1.125rem; }
        .jogo table { border-spacing: 4px; margin: 8px 0 12px; }
        .jogo th { font-size: 1.25rem; }
        .jogo td { height: 56px; }
        .jogo td, .jogo td button { font-size: 1.25rem; }
        .jogo td button:disabled { cursor: default; }
        .jogo td.padrao { background: var(--verde); border-color: var(--verde); color: #fff; }
        .jogo td.central { font-size: 0.875rem; }
    </style>
</head>
<body>
    <main class="jogo">
        <h1>Bingo</h1>
        <p class="subtitulo">Complete uma linha, coluna, diagonal ou os quatro cantos. O centro é livre.</p>

        <div class="controles">
            <fieldset>
                <legend>Cartelas</legend>
                <label><input type="radio" name="quantidade" value="1" checked> 1</label>
                <label><input type="radio" name="quantidade" value="2"> 2</label>
                <label><input type="radio" name="quantidade" value="3"> 3</label>
                <label><input type="radio" name="quantidade" value="4"> 4</label>
            </fieldset>
            <button type="button" id="nova-partida" class="menu-button">Nova partida</button>
            <button type="button" id="sortear" class="menu-button primario" disabled>Sortear</button>
            <a href="../../index.html" class="menu-button discreto">Voltar ao início</a>
        </div>

        <p id="mensagem" role="status">Escolha quantas cartelas quer usar e clique em "Nova partida".</p>

        <section class="sorteio" aria-label="Números sorteados">
            <div id="ultimo" aria-hidden="true">–</div>
            <ol id="chamados"></ol>
        </section>

        <section id="cartelas" aria-label="Minhas cartelas"></section>
    </main>

    <script src="../js/logica.js"></script>
    <script src="../js/jogo.js"></script>
</body>
</html>
